name: Proposal SQL replay

on:
  push:
    branches:
      - codex/proposal-replay
    paths:
      - .github/workflows/proposal-sql-replay.yml
      - proposal-replay/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-sql:
    if: github.ref == 'refs/heads/codex/proposal-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check existing local PostgreSQL and standard-library runtimes
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0 || { echo '[proposal sql] initdb requires a non-root runner.'; exit 1; }
          command -v pg_config >/dev/null || { echo '[proposal sql] pg_config is required.'; exit 1; }
          task_replay_pg_bin="$(pg_config --bindir)"
          for task_replay_tool in initdb pg_ctl psql; do
            test -x "$task_replay_pg_bin/$task_replay_tool" || { echo "[proposal sql] Missing PostgreSQL executable: $task_replay_tool"; exit 1; }
          done
          test -f "$(pg_config --sharedir)/extension/pgcrypto.control" || { echo '[proposal sql] The existing pgcrypto extension is required.'; exit 1; }
          command -v python3 >/dev/null || { echo '[proposal sql] Python 3 is required.'; exit 1; }
          command -v node >/dev/null || { echo '[proposal sql] Node.js is required.'; exit 1; }
          pg_config --version
          python3 --version
          node --version
          task_replay_report_dir="$RUNNER_TEMP/stableflow-proposal-sql"
          mkdir -p "$task_replay_report_dir"
          printf 'STABLEFLOW_REPLAY_REPORT_DIR=%s\n' "$task_replay_report_dir" >> "$GITHUB_ENV"
      - name: Replay exact unread receipt SQL and its negative controls
        run: |
          set -euo pipefail
          node proposal-replay/unread.mjs | tee "$STABLEFLOW_REPLAY_REPORT_DIR/unread.log"
      - name: Replay rate quota and duplicate receipt interleavings
        run: |
          set -euo pipefail
          python3 proposal-replay/rate-concurrency.py before | tee "$STABLEFLOW_REPLAY_REPORT_DIR/rate-concurrency-before.log"
          python3 proposal-replay/rate-concurrency.py after | tee "$STABLEFLOW_REPLAY_REPORT_DIR/rate-concurrency-after.log"
      - name: Replay rate duplicate target deletion interleavings
        run: |
          set -euo pipefail
          python3 proposal-replay/rate-duplicate-target.py --run-local-replay --receipt "$STABLEFLOW_REPLAY_REPORT_DIR/rate-duplicate-target-result.json" | tee "$STABLEFLOW_REPLAY_REPORT_DIR/rate-duplicate-target.log"
      - name: Keep proposal-only replay receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proposal-sql-replay-evidence
          path: ${{ runner.temp }}/stableflow-proposal-sql/
          if-no-files-found: ignore
          retention-days: 7
